name: spm Linux

"on":
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Go and systemd integration (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Run tests with race detector
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Show unit-test coverage
        run: go tool cover -func=coverage.out

      - name: Run vet
        run: go vet ./...

      - name: Test installer
        run: sh scripts/test-install-sh.sh

      - name: Build spm
        run: go build -cover -covermode=atomic -buildvcs=false -o spm ./cmd/spm

      - name: Prepare E2E coverage directory
        run: |
          mkdir -p "$RUNNER_TEMP/spm-e2e-coverage"
          chmod 0777 "$RUNNER_TEMP/spm-e2e-coverage"

      - name: Run real systemd integration test
        env:
          SPM_CI_PREFIX: ci-${{ github.run_id }}-${{ github.run_attempt }}
          GOCOVERDIR: ${{ runner.temp }}/spm-e2e-coverage
        run: |
          sudo install -m 0755 ./spm /usr/local/bin/spm-ci
          trap 'sudo rm -f /usr/local/bin/spm-ci' EXIT
          sudo --preserve-env=SPM_CI_PREFIX,GOCOVERDIR bash scripts/ci-systemd-e2e.sh /usr/local/bin/spm-ci

      - name: Run real user-systemd integration test
        env:
          SPM_CI_PREFIX: ci-user-${{ github.run_id }}-${{ github.run_attempt }}
          GOCOVERDIR: ${{ runner.temp }}/spm-e2e-coverage
        run: |
          uid=$(id -u)
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$uid.service"
          export XDG_RUNTIME_DIR="/run/user/$uid"
          systemctl --user daemon-reload
          bash scripts/ci-linux-user-e2e.sh ./spm

      - name: Merge unit and E2E coverage
        shell: bash
        run: |
          go tool covdata textfmt -i="$RUNNER_TEMP/spm-e2e-coverage" -o=e2e-coverage.out
          go run .github/scripts/merge-coverage.go -o combined-coverage.out coverage.out e2e-coverage.out
          go tool cover -func=combined-coverage.out

      - name: Enforce combined coverage floor
        shell: bash
        run: |
          coverage=$(go tool cover -func=combined-coverage.out | awk '/^total:/ { gsub(/%/, "", $3); print $3 }')
          echo "Combined statement coverage: ${coverage}%"
          awk -v coverage="$coverage" 'BEGIN { if (coverage + 0 < 80.0) { printf "Combined coverage %.1f%% is below the 80.0%% floor\n", coverage; exit 1 } }'
          echo "### Linux ${{ matrix.os }} combined coverage: ${coverage}%" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage profiles
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-linux-${{ matrix.os }}
          path: "*coverage.out"
          if-no-files-found: error
          retention-days: 14

  compatibility:
    name: Unit compatibility (${{ matrix.distro }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Debian 13
            image: debian:13
          - distro: Fedora
            image: fedora:latest
          - distro: openSUSE Leap
            image: opensuse/leap:latest
          - distro: Arch Linux
            image: archlinux:base
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.image }}
    timeout-minutes: 15
    defaults:
      run:
        shell: /bin/sh -e {0}

    steps:
      - name: Install systemd tools
        working-directory: /
        run: |
          case "${{ matrix.distro }}" in
            "Debian 13")
              apt-get update
              apt-get install -y --no-install-recommends ca-certificates git systemd
              ;;
            "Fedora")
              dnf install -y ca-certificates git gzip systemd tar
              ;;
            "openSUSE Leap")
              zypper --non-interactive install ca-certificates git gzip tar
              zypper --non-interactive install --force systemd
              test -x /usr/bin/systemd-analyze
              ;;
            "Arch Linux")
              pacman -Syu --noconfirm ca-certificates git systemd
              ;;
          esac

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Run tests and verify generated units
        run: |
          export PATH="/usr/bin:/bin:$PATH"
          /usr/bin/systemd-analyze --version
          go test ./...

      - name: Build spm
        run: go build -buildvcs=false -o spm ./cmd/spm

  quality:
    name: Static analysis, vulnerabilities, and fuzz smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up current Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Verify module checksums
        run: go mod verify

      - name: Run Staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: "2026.2.2"
          install-go: false
          min-go-version: "1.26"
          checks: "inherit,-U1000"

      - name: Scan reachable vulnerabilities
        uses: golang/govulncheck-action@v1
        with:
          repo-checkout: false
          go-version-input: stable
          go-package: ./...

      - name: Fuzz cron parsing
        run: go test ./internal/app -run=^$ -fuzz=^FuzzParseCronExpression$ -fuzztime=10s

      - name: Fuzz MCP argument decoding
        run: go test ./internal/app -run=^$ -fuzz=^FuzzDecodeMCPArguments$ -fuzztime=10s
