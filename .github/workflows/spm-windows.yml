name: spm Windows

"on":
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Windows ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Server 2022
            runner: windows-2022
          - name: Server 2025
            runner: windows-2025

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Test
        run: go test -cover ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -buildvcs=false -o spm.exe ./cmd/spm

      - name: Test installer
        shell: pwsh
        run: .\scripts\test-install-ps1.ps1 -Spm .\spm.exe

      - name: Exercise Windows user services
        shell: pwsh
        env:
          SPM_CI_PREFIX: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.runner }}
        run: |
          .\scripts\ci-windows-e2e.ps1 -Spm .\spm.exe -Scope User -Prefix $env:SPM_CI_PREFIX

      - name: Exercise Windows SCM services
        shell: pwsh
        env:
          SPM_CI_PREFIX: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.runner }}
        run: |
          .\scripts\ci-windows-e2e.ps1 -Spm .\spm.exe -Scope System -Prefix $env:SPM_CI_PREFIX
