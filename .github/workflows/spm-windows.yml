name: spm Windows

"on":
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Windows ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Server 2022
            runner: windows-2022
          - name: Server 2025
            runner: windows-2025

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Test
        run: go test -covermode atomic -coverprofile coverage.out ./...

      - name: Show unit-test coverage
        shell: pwsh
        run: |
          go tool cover -func coverage.out

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: "2023.1.7"
          install-go: false
          min-go-version: "1.21"
          checks: "inherit,-U1000"
          cache-key: ${{ matrix.runner }}

      - name: Build
        run: go build -cover -covermode atomic -buildvcs=false -o spm.exe ./cmd/spm

      - name: Prepare E2E coverage directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'spm-e2e-coverage') | Out-Null

      - name: Test installer
        shell: pwsh
        run: .\scripts\test-install-ps1.ps1 -Spm .\spm.exe

      - name: Exercise Windows user services
        shell: pwsh
        env:
          SPM_CI_PREFIX: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.runner }}
          GOCOVERDIR: ${{ runner.temp }}\spm-e2e-coverage
        run: |
          .\scripts\ci-windows-e2e.ps1 -Spm .\spm.exe -Scope User -Prefix $env:SPM_CI_PREFIX

      - name: Exercise Windows SCM services
        shell: pwsh
        env:
          SPM_CI_PREFIX: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.runner }}
          GOCOVERDIR: ${{ runner.temp }}\spm-e2e-coverage
        run: |
          .\scripts\ci-windows-e2e.ps1 -Spm .\spm.exe -Scope System -Prefix $env:SPM_CI_PREFIX

      - name: Merge unit and E2E coverage
        shell: pwsh
        env:
          GOCOVERDIR: ${{ runner.temp }}\spm-e2e-coverage
        run: |
          go tool covdata textfmt -i $env:GOCOVERDIR -o e2e-coverage.out
          go run .github/scripts/merge-coverage.go -o combined-coverage.out coverage.out e2e-coverage.out
          go tool cover -func combined-coverage.out

      - name: Enforce combined coverage floor
        shell: pwsh
        run: |
          $total = (go tool cover -func combined-coverage.out | Select-String '^total:').Line
          if ($total -notmatch '([0-9.]+)%$') {
            throw "Could not parse total coverage from: $total"
          }
          $coverage = [double]$Matches[1]
          "Combined statement coverage: $coverage%"
          if ($coverage -lt 80.0) {
            throw "Combined coverage $coverage% is below the 80.0% floor"
          }
          "### Windows ${{ matrix.name }} combined coverage: $coverage%" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload coverage profiles
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-windows-${{ matrix.runner }}
          path: "*coverage.out"
          if-no-files-found: error
          retention-days: 14
