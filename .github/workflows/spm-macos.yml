name: spm macOS

"on":
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: macOS ${{ matrix.os }} / Go ${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            go: 1.21.x
            e2e: full
          - os: macos-26-intel
            go: stable
            e2e: schedule

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Show unit-test coverage
        shell: bash
        run: |
          go tool cover -func=coverage.out

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: "2023.1.7"
          install-go: false
          min-go-version: "1.21"
          checks: "inherit,-U1000"
          cache-key: ${{ matrix.go }}

      - name: Test installer
        run: sh scripts/test-install-sh.sh

      - name: Build
        run: go build -cover -covermode=atomic -buildvcs=false -o spm-ci ./cmd/spm

      - name: Prepare E2E coverage directory
        run: |
          mkdir -p "$RUNNER_TEMP/spm-e2e-coverage"
          chmod 0777 "$RUNNER_TEMP/spm-e2e-coverage"

      - name: Exercise user and system services
        shell: bash
        env:
          SPM_CI_PREFIX: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}
          SPM_CI_E2E_MODE: ${{ matrix.e2e }}
          GOCOVERDIR: ${{ runner.temp }}/spm-e2e-coverage
        run: |
          user_log="$RUNNER_TEMP/spm-macos-user.log"
          system_log="$RUNNER_TEMP/spm-macos-system.log"
          sudo -v
          set +e
          bash scripts/ci-macos-e2e.sh ./spm-ci user >"$user_log" 2>&1 &
          user_pid=$!
          bash scripts/ci-macos-e2e.sh ./spm-ci system >"$system_log" 2>&1 &
          system_pid=$!
          wait "$user_pid"
          user_status=$?
          wait "$system_pid"
          system_status=$?
          set -e
          sed 's/^/[user] /' "$user_log"
          sed 's/^/[system] /' "$system_log"
          if ((user_status != 0 || system_status != 0)); then
            echo "macOS E2E failed: user=$user_status system=$system_status" >&2
            exit 1
          fi

      - name: Merge unit and E2E coverage
        shell: bash
        run: |
          go tool covdata textfmt -i="$RUNNER_TEMP/spm-e2e-coverage" -o=e2e-coverage.out
          go run .github/scripts/merge-coverage.go -o combined-coverage.out coverage.out e2e-coverage.out
          go tool cover -func=combined-coverage.out

      - name: Enforce combined coverage floor
        shell: bash
        run: |
          coverage=$(go tool cover -func=combined-coverage.out | awk '/^total:/ { gsub(/%/, "", $3); print $3 }')
          echo "Combined statement coverage: ${coverage}%"
          awk -v coverage="$coverage" 'BEGIN { if (coverage + 0 < 80.0) { printf "Combined coverage %.1f%% is below the 80.0%% floor\n", coverage; exit 1 } }'
          echo "### macOS ${{ matrix.os }} / Go ${{ matrix.go }} combined coverage: ${coverage}%" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage profiles
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-macos-${{ matrix.os }}-go-${{ matrix.go }}
          path: "*coverage.out"
          if-no-files-found: error
          retention-days: 14
