name: spm macOS

"on":
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: macOS ${{ matrix.os }} / Go ${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            go: 1.21.x
          - os: macos-26-intel
            go: stable

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Test installer
        run: sh scripts/test-install-sh.sh

      - name: Build
        run: go build -buildvcs=false -o spm-ci ./cmd/spm

      - name: Exercise user and system services
        shell: bash
        env:
          SPM_CI_PREFIX: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}
        run: |
          user_log="$RUNNER_TEMP/spm-macos-user.log"
          system_log="$RUNNER_TEMP/spm-macos-system.log"
          sudo -v
          set +e
          bash scripts/ci-macos-e2e.sh ./spm-ci user >"$user_log" 2>&1 &
          user_pid=$!
          bash scripts/ci-macos-e2e.sh ./spm-ci system >"$system_log" 2>&1 &
          system_pid=$!
          wait "$user_pid"
          user_status=$?
          wait "$system_pid"
          system_status=$?
          set -e
          sed 's/^/[user] /' "$user_log"
          sed 's/^/[system] /' "$system_log"
          if ((user_status != 0 || system_status != 0)); then
            echo "macOS E2E failed: user=$user_status system=$system_status" >&2
            exit 1
          fi
