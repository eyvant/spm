name: macOS

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: macOS ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod

      - name: Test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -buildvcs=false -o spm-ci ./cmd/spm

      - name: Validate cross-platform declaration
        shell: bash
        run: |
          cat > spm-ci.toml <<'EOF'
          schema = 1
          [[services]]
          name = "ci-declaration"
          command = ["/usr/bin/true"]
          [services.linux]
          user = "nobody"
          [services.windows]
          command = ["cmd.exe", "/c", "exit", "0"]
          [services.macos]
          command = ["/usr/bin/true"]
          EOF
          ./spm-ci validate spm-ci.toml

      - name: Exercise LaunchAgent lifecycle
        shell: bash
        run: |
          name="spm-ci-user-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() { ./spm-ci delete --yes "$name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          ./spm-ci start --name "$name" --no-enable -- /bin/sleep 60
          ./spm-ci list --json | grep -F "\"$name\""
          ./spm-ci status "$name"
          ./spm-ci stop "$name"
          ./spm-ci delete --yes "$name"

      - name: Exercise LaunchDaemon lifecycle
        shell: bash
        run: |
          name="spm-ci-system-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() { sudo ./spm-ci --system delete --yes "$name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          sudo ./spm-ci --system start --name "$name" --no-enable -- /bin/sleep 60
          sudo ./spm-ci --system list --json | grep -F "\"$name\""
          sudo ./spm-ci --system status "$name"
          sudo ./spm-ci --system stop "$name"
          sudo ./spm-ci --system delete --yes "$name"
