name: Release

"on":
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi

  ci:
    name: Require successful CI
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Wait for CI workflows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          workflows=(spm-linux.yml spm-macos.yml spm-windows.yml)
          pending=("${workflows[@]}")

          while ((${#pending[@]})); do
            next=()

            for workflow in "${pending[@]}"; do
              run=$(gh api --method GET \
                "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs" \
                -f head_sha="$GITHUB_SHA" \
                -f event=push \
                -f per_page=10 \
                --jq '.workflow_runs | sort_by(.id) | reverse | .[0] // empty')

              if [[ -z "$run" ]]; then
                echo "$workflow: waiting for a run on $GITHUB_SHA"
                next+=("$workflow")
                continue
              fi

              status=$(jq -r '.status' <<<"$run")
              conclusion=$(jq -r '.conclusion // ""' <<<"$run")
              url=$(jq -r '.html_url' <<<"$run")

              if [[ "$status" != completed ]]; then
                echo "$workflow: $status ($url)"
                next+=("$workflow")
              elif [[ "$conclusion" == success ]]; then
                echo "$workflow: success ($url)"
              else
                echo "$workflow: required CI concluded with $conclusion ($url)" >&2
                exit 1
              fi
            done

            pending=("${next[@]}")
            ((${#pending[@]})) && sleep 20
          done

  build:
    name: Build ${{ matrix.name }}
    needs: ci
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            goarch: amd64
          - name: linux-arm64
            goarch: arm64
          - name: linux-armv7
            goarch: arm
            goarm: "7"
          - name: linux-riscv64
            goarch: riscv64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Build archive
        shell: bash
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm || '' }}
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="spm-${GITHUB_REF_NAME}-${{ matrix.name }}.tar.gz"
          mkdir -p build
          go build -buildvcs=false -trimpath \
            -ldflags="-s -w -X github.com/eyvant/spm/internal/app.version=${version}" \
            -o build/spm ./cmd/spm
          cp LICENSE build/LICENSE
          tar -C build -czf "$archive" spm LICENSE

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: spm-${{ matrix.name }}
          path: spm-*.tar.gz
          if-no-files-found: error
          retention-days: 1

  build-windows:
    name: Build ${{ matrix.name }}
    needs: ci
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            goarch: amd64
          - name: windows-arm64
            goarch: arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Build archive
        shell: bash
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="spm-${GITHUB_REF_NAME}-${{ matrix.name }}.zip"
          mkdir -p build
          go build -buildvcs=false -trimpath \
            -ldflags="-s -w -X github.com/eyvant/spm/internal/app.version=${version}" \
            -o build/spm.exe ./cmd/spm
          cp LICENSE build/LICENSE
          (cd build && zip -9 "../$archive" spm.exe LICENSE)

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: spm-${{ matrix.name }}
          path: spm-*.zip
          if-no-files-found: error
          retention-days: 1

  build-macos:
    name: Build ${{ matrix.name }}
    needs: ci
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-amd64
            goarch: amd64
          - name: macos-arm64
            goarch: arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Build archive
        shell: bash
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="spm-${GITHUB_REF_NAME}-${{ matrix.name }}.tar.gz"
          mkdir -p build
          go build -buildvcs=false -trimpath \
            -ldflags="-s -w -X github.com/eyvant/spm/internal/app.version=${version}" \
            -o build/spm ./cmd/spm
          cp LICENSE build/LICENSE
          tar -C build -czf "$archive" spm LICENSE

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: spm-${{ matrix.name }}
          path: spm-*.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: [build, build-windows, build-macos]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cp install.sh dist/install.sh
          cp install.ps1 dist/install.ps1
          cp LICENSE dist/LICENSE
          chmod 0755 dist/install.sh
          cd dist
          sha256sum spm-*.tar.gz spm-*.zip install.sh install.ps1 LICENSE > checksums.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/* \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi
