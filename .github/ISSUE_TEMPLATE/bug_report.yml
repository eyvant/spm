name: Bug report
description: Something in spm does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact spm command (remove secrets).
      render: shell
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and version
      placeholder: Ubuntu 24.04 / macOS 15.2 / Windows 11 24H2
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options: [User (default), System (--system)]
    validations:
      required: true
  - type: dropdown
    id: via
    attributes:
      label: How spm was invoked
      options: [Terminal, MCP server (agent), Claude Code plugin, Other]
  - type: textarea
    id: version
    attributes:
      label: spm version and spm doctor output
      description: Output of `spm version` and `spm doctor`.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output of `spm logs NAME -n 100` or `spm show NAME`.
      render: text
