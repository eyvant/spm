name: Feature request
description: Suggest an improvement to spm, its MCP server, or the agent plugin
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The command, option, or MCP tool you would like, with an example.
  - type: input
    id: platforms
    attributes:
      label: Platforms that matter to you
      placeholder: Linux, macOS, Windows
